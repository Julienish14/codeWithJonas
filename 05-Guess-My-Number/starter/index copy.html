<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Guess Number</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <div class="main-part">
      <div class="top-part">
        <button class="again">Again!</button>
        <span>(Between 1 and 20)</span>
      </div>
      <div class="mid-part">
        <h2>Guess My Number!</h2>
        <div class="numb">?</div>
        <span class="line"></span>
      </div>
      <div class="left">
        <input type="number" class="guess" />
        <button>Check!</button>
      </div>
      <div class="right">
        <span class="message">Start guessing...</span>
        <span class="score">💯 Score:</span>
        <span class="highscore">🏅 Highscore: </span>
      </div>
    </div>
  </body>
</html>
